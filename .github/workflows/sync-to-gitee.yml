# 放到 GitHub 仓库里的 .github/workflows/sync-to-gitee.yml
#
# 作用：每小时检查 github.com/FrizzleM/siboot，有新版本就同步到 Gitee。
# 只改两处：GITEE_OWNER / GITEE_REPO（如果你以后改名）。
# GITEE_TOKEN 不要写在这里，放到仓库 Settings → Secrets and variables → Actions。

name: sync-siboot-to-gitee

on:
  schedule:
    # 每小时的第 7 分钟。
    # 不写 0 是为了避开整点：GitHub 的定时任务在整点前后最拥堵，
    # 容易排队甚至被丢弃。第 7 分钟几乎是空的，准时率高得多。
    # 想更快就改成 "*/15 * * * *"，但每小时一次已经够用（作者约 3 天发一版）。
    - cron: "7 * * * *"
  workflow_dispatch:      # 想立刻同步时，来这里手动点一下

permissions:
  contents: write         # 给下面的心跳步骤用

concurrency:
  group: sync-siboot
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35    # 跨境上传约 17 分钟，留余量
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests

      - name: Diagnose Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: TeMaTou1145
          GITEE_REPO: siboot-mirror
        run: |
          echo "::add-mask::$GITEE_TOKEN"
          curl -sS -o /dev/null -m 20 -w "api repo:  %{http_code}  %{time_total}s  ip=%{remote_ip}\n" \
            "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO" || echo "api repo: FAIL"
          curl -sS -o /dev/null -m 20 -w "web repo:  %{http_code}  %{time_total}s  ip=%{remote_ip}\n" \
            "https://gitee.com/$GITEE_OWNER/$GITEE_REPO" || echo "web repo: FAIL"
          curl -sS -o /dev/null -m 20 -w "releases:  %{http_code}  %{time_total}s  ip=%{remote_ip}\n" \
            "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases?per_page=1" || echo "releases: FAIL"

      - name: Sync to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: TeMaTou1145
          GITEE_REPO: siboot-mirror
        run: |
          echo "::add-mask::$GITEE_TOKEN"
          # 一次上传要 17 分钟左右（跨境上行约 12 KB/s），重试会撞上 job 超时。
          # 失败就等下一个整点自动再来，成本为零。
          python -u sync.py

      # GitHub 的定时任务在仓库 60 天没有任何提交后会被自动停掉。
      # 每月 1 号提交一个时间戳，让这个仓库永远不算"无活动"。
      - name: Keepalive
        if: github.event_name != 'workflow_dispatch'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u +%FT%TZ > .heartbeat
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .heartbeat
            git commit -m "chore: keepalive" >/dev/null
            git push
          fi
